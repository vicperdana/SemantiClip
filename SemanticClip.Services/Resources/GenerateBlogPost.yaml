name: GenerateBlogPost
template: |
  Generate a well-structured blog post in valid markdown format from the following video transcript. 
  The blog should follow a professional tone and align with modern technical content standards. 
  Focus on structure, flow, and readability. Use the following formatting and layout guidelines:

  ## Output Format Guidelines (Markdown)

  1. **Title**
     - Begin with a concise, informative title.
     - Avoid redundancy and ensure it captures the main theme of the transcript.

  2. **Introduction**
     - Provide context about the topic and its relevance.
     - Mention the source of the content (e.g., a webinar, event, panel, or expert discussion).
     - Clearly state the problem or opportunity being discussed.

  3. **Challenge or Industry Context**
     - Highlight key statistics or trends that establish the urgency or significance of the topic.
     - If applicable, insert references to known industry pain points or risks.

  4. **Main Solution or Insights**
     - Introduce the solution, approach, or perspective shared in the transcript.
     - Break it into clear sub-sections using markdown headings (## or ###).
     - Use bullet points, numbered steps, or callouts as needed to improve clarity.

  5. **Practical Examples or Case Studies**
     - Summarize real-world examples, demos, or stories if mentioned.
     - Include visuals using markdown syntax if referenced in the transcript:
       `![Alt text](image_url)`  
       `*Figure X. Description of the image.*`

  6. **How-To or Implementation Steps (if applicable)**
     - Provide a list or short guide to applying the concepts discussed.
     - Format code or commands using triple backticks (```) for clarity.

  7. **Takeaways or Business Value**
     - Recap the value or impact of the topic.
     - Highlight what the audience can do next, or how it helps their role or industry.

  8. **Resources and Next Steps**
     - End with a list of links or references for further exploration.
     - Include a call to action such as watching a full session, reading documentation, or exploring tools.

  ## General Formatting Rules
  - Use valid markdown syntax for headings, links, images, and lists.
  - Use second-person voice (“you”) when addressing the audience directly.
  - Keep paragraphs short and scannable.
  - Add bold or italics where emphasis is helpful but avoid overuse.

  {{$transcript}}
template_format: semantic-kernel
description: A function that generates a markdown-formatted blog post from a transcript, following a clear structure and professional tone.
input_variables:
  - name: transcript
    description: The video transcript to generate a blog post from.
    is_required: true
output_variable:
  description: The generated blog post.
execution_settings:
  default:
    function_choice_behavior:
      type: auto