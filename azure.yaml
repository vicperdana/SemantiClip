# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: semanticlip
metadata:
  template: semanticlip@0.0.1-beta
  
services:
  api:
    project: ./SemanticClip.API
    language: csharp
    host: appservice
    
workflows:
  up:
    steps:
      - azd: provision
      - azd: deploy

infra:
  provider: bicep
  parameters:
    azureOpenAiEndpoint:
      value: "{{ .Env.AZURE_OPENAI_ENDPOINT }}"
    azureOpenAiApiKey:
      value: "{{ .Env.AZURE_OPENAI_API_KEY }}"
    azureOpenAiWhisperDeploymentName:
      value: "{{ .Env.AZURE_OPENAI_WHISPER_DEPLOYMENT_NAME }}"
    azureOpenAiContentDeploymentName:
      value: "{{ .Env.AZURE_OPENAI_CONTENT_DEPLOYMENT_NAME }}"
    azureAiAgentConnectionString:
      value: "{{ .Env.AZURE_AI_AGENT_CONNECTION_STRING }}"
    azureAiAgentChatModelId:
      value: "{{ .Env.AZURE_AI_AGENT_CHAT_MODEL_ID }}"
    azureAiAgentVectorStoreId:
      value: "{{ .Env.AZURE_AI_AGENT_VECTOR_STORE_ID }}"
    azureAiAgentMaxEvaluations:
      value: "{{ .Env.AZURE_AI_AGENT_MAX_EVALUATIONS }}"
    githubPersonalAccessToken:
      value: "{{ .Env.GITHUB_PERSONAL_ACCESS_TOKEN }}"
    fileUploadMaxRequestBodySizeInBytes:
      value: "{{ .Env.FILE_UPLOAD_MAX_REQUEST_BODY_SIZE_IN_BYTES }}"
    fileUploadAllowedExtensions:
      value: "{{ .Env.FILE_UPLOAD_ALLOWED_EXTENSIONS }}"