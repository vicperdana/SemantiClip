# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: semanticlip
metadata:
  template: semanticlip@0.0.1-beta

infra:
  parameters:
    azureOpenAiEndpoint: "${AZURE_OPENAI_ENDPOINT}"
    azureOpenAiApiKey: "${AZURE_OPENAI_API_KEY}"
    azureAiAgentConnectionString: "${AZURE_AI_AGENT_CONNECTION_STRING}"
    gitHubPersonalAccessToken: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
  
services:
  api:
    project: ./SemanticClip.API
    host: appservice
    language: dotnet
    
  web:
    project: ./SemanticClip.Client  
    host: appservice
    language: dotnet

hooks:
  preprovision:
    shell: sh
    run: |
      echo "Checking required environment variables..."
      if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
        echo "❌ Error: AZURE_OPENAI_ENDPOINT environment variable is required."
        echo "Please set it using: azd env set AZURE_OPENAI_ENDPOINT <your-endpoint>"
        exit 1
      fi
      if [ -z "$AZURE_OPENAI_API_KEY" ]; then
        echo "❌ Error: AZURE_OPENAI_API_KEY environment variable is required."
        echo "Please set it using: azd env set AZURE_OPENAI_API_KEY <your-api-key>"
        exit 1
      fi
      if [ -z "$AZURE_AI_AGENT_CONNECTION_STRING" ]; then
        echo "❌ Error: AZURE_AI_AGENT_CONNECTION_STRING environment variable is required."
        echo "Please set it using: azd env set AZURE_AI_AGENT_CONNECTION_STRING <your-connection-string>"
        exit 1
      fi
      if [ -z "$GITHUB_PERSONAL_ACCESS_TOKEN" ]; then
        echo "❌ Error: GITHUB_PERSONAL_ACCESS_TOKEN environment variable is required."
        echo "Please set it using: azd env set GITHUB_PERSONAL_ACCESS_TOKEN <your-token>"
        exit 1
      fi
      echo "✅ All required environment variables are set."
  
  postprovision:
    shell: sh
    run: |
      echo "Setting up application configuration..."
      azd env set azureAiAgentMaxEvaluations 3
      azd env set azureAiAgentChatModelId gpt-4o
      azd env set azureOpenAiContentDeploymentName gpt-4o
      azd env set azureOpenAiWhisperDeploymentName whisper
      azd env set fileUploadMaxRequestBodySizeInBytes 30000000
      azd env set fileUploadAllowedExtensions ".mp4,.avi,.mov,.wmv,.mkv"
      echo "Configuration completed successfully."